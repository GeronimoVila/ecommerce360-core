info:
  name: Crear producto
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/products"
  body:
    type: json
    data: |-
      {
        "sku": "heladera-samsung",
        "name": "Heladera Samsung",
        "purchase_cost": 10,
        "vat_rate": 21,
        "profit_margin": 30,
        "physical_stock": 50,
        "commission_rate": 5.0,
        "category_id": "f68c1ec3-0a81-4cbd-85e1-90d3f8b80193"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
